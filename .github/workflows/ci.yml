name: "Nuke CI"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Locally ci.sh logs to a temp directory; CI needs a fixed path to upload from.
  NUKE_CI_OUTPUT_DIR: .build/ci

jobs:
  # The job matrix lives in .scripts/ci.sh, not here — `make ci` runs exactly
  # what CI runs. Run `make ci-list` to see every job and which group it is in.
  #
  # GitHub Free allows 5 concurrent macOS runners, so there are at most 5 macOS
  # jobs, grouped to keep them balanced rather than letting one dominate.
  #
  # Nuke 14 requires Xcode 27, and the macOS 26 image only has Xcode 26. The
  # xcode-27 image is a public preview, and it's the only one that has Xcode 27.
  ci:
    name: ${{ matrix.name }}
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: ios
            name: Tests (iOS)
          - group: tvos
            name: Tests (tvOS)
          - group: macos
            name: Tests (macOS)
          - group: platforms
            name: Build (watchOS, visionOS, Snippets, SPM) + TSan
    steps:
      - uses: actions/checkout@v7
      - name: Run ${{ matrix.group }}
        run: .scripts/ci.sh ${{ matrix.group }}
      # Folded into the shortest job, to stay within the concurrent macOS job
      # budget.
      - name: Run tsan
        if: matrix.group == 'platforms'
        run: .scripts/ci.sh tsan
      - name: Upload xcresult bundles
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcresult-${{ matrix.group }}
          path: .build/ci/*.xcresult
          retention-days: 7
          if-no-files-found: ignore

  # On a Linux runner, so linting costs no macOS concurrency.
  lint:
    name: SwiftLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: ghcr.io/realm/swiftlint:0.65.0
    steps:
      - uses: actions/checkout@v7
      - name: Run lint
        run: .scripts/ci.sh lint
