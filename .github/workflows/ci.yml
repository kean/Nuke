name: "Nuke CI"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
  # Locally ci.sh logs to a temp directory; CI needs a fixed path to upload from.
  NUKE_CI_OUTPUT_DIR: .build/ci

jobs:
  # The job matrix lives in .scripts/ci.sh, not here — `make ci` runs exactly
  # what CI runs. Run `make ci-list` to see every job and which group it is in.
  #
  # GitHub Free allows 5 concurrent macOS runners, so there are exactly 5 macOS
  # jobs, grouped to keep them balanced rather than letting one dominate.
  ci:
    name: ${{ matrix.name }}
    runs-on: macOS-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: ios-core
            name: Tests (Nuke, iOS)
          - group: ios-ui
            name: Tests (NukeUI + NukeExtensions, iOS)
          - group: tvos
            name: Tests (tvOS)
          - group: macos
            name: Tests (macOS)
          - group: platforms
            name: Build (watchOS, visionOS, NukeVideo, SPM)
    steps:
      - uses: actions/checkout@v7
      - name: Run ${{ matrix.group }}
        run: .scripts/ci.sh ${{ matrix.group }}
      # Backward compatibility against the oldest supported Xcode. Folded into
      # the (short) macOS job rather than given its own runner, to stay within
      # the 5 concurrent macOS job budget.
      - name: Re-run on Xcode 26.0
        if: matrix.group == 'macos'
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.0.app/Contents/Developer
        run: .scripts/ci.sh macos
      - name: Upload xcresult bundles
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcresult-${{ matrix.group }}
          path: .build/ci/*.xcresult
          retention-days: 7
          if-no-files-found: ignore

  # On a Linux runner, so linting costs no macOS concurrency.
  lint:
    name: SwiftLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: ghcr.io/realm/swiftlint:0.65.0
    steps:
      - uses: actions/checkout@v7
      - name: Run lint
        run: .scripts/ci.sh lint
